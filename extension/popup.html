<h1>Facebook / Threads 快速封鎖</h1><p>點留言姓名旁的「封鎖此人」，加入佇列，每次處理一人，間隔 2 秒。可在左下角暫停或取消等待項目。</p><p>只有網站回傳成功或顯示明確成功提示才顯示「已封鎖」。若結果不明，請先查看該網站封鎖名單。</p><p id="status" role="status">檢查目前分頁…</p><button id="check">檢查目前個人檔案（不封鎖）</button><p id="profile-status" role="status"></p><small>Facebook 使用直接請求；Threads 操作原生封鎖視窗。必要資料只由對應平台處理，不傳給開發者。更新後請重新整理分頁。</small><p>按下封鎖即會執行；Threads 的確認會自動完成。</p><p><a href="privacy.html" target="_blank" rel="noopener">隱私政策</a> · MIT 授權 · 非 Meta 官方產品</p><script src="popup.js"></script></html>
